name: CI

on:
  push:
  pull_request:

jobs:
  portable:
    name: Linux (portable code + cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile for FreeBSD
        run: |
          for arch in amd64 arm64 386 arm; do GOOS=freebsd GOARCH=$arch go vet ./...; done
          GOOS=freebsd GOARCH=amd64 go test -c -o /dev/null ./pkg/ioctl

  freebsd:
    name: FreeBSD ${{ matrix.release }} (real ZFS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14.3", "15.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          copyback: true
          prepare: |
            pkg install -y go
          run: |
            # The test command never fails this script: the verdict is written
            # to test.rc and judged by the next step, so test.log always
            # reaches the host even when the tests fail.
            set +e   # the VM shell may run with errexit; the verdict goes to test.rc
            cd "$GITHUB_WORKSPACE"
            {
              echo "== $(uname -sr), osreldate $(sysctl -n kern.osreldate)"
              kldload zfs 2>&1 || true
              kldstat | grep -i zfs || echo "zfs module NOT loaded"
              truncate -s 512m /tmp/zpool.img
              zpool create -f -m none testpool /tmp/zpool.img
              zpool list
              zfs list
              go version
              # Datasets, snapshots, holds, bookmarks and large property lists
              # that the tests compare against zfs(8). A failure shows up as
              # failing tests; keep going so the log is complete.
              sh internal/ci/fixtures.sh testpool || echo "FIXTURES FAILED"
            } > test.log 2>&1
            export ZFS_TEST_POOL=testpool
            # -p 1: the packages share one pool, and the ioctl smoke test
            # creates and destroys a snapshot of its root; run them one by one.
            rc=0
            go vet ./... >> test.log 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              go test -p 1 -v -count=1 ./... >> test.log 2>&1 || rc=$?
            fi
            echo "$rc" > test.rc
            exit 0
      - name: Surface FreeBSD test output
        if: always()
        run: |
          if [ ! -f test.log ]; then
            echo "::error::test.log was not copied back from the VM"
            exit 1
          fi
          # Job logs cannot always be downloaded; annotations can be read through the API.
          grep -E '^(--- FAIL|FAIL|panic:)' test.log | head -n 10 | while IFS= read -r line; do
            echo "::error title=FreeBSD ${{ matrix.release }}::$line"
          done
          # A compact verdict per test; the tail below can be cut off by the size limit.
          res=$(grep -E -- '^(--- |ok |FAIL|PASS|panic)' test.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=FreeBSD ${{ matrix.release }} test results::$res"
          msg=$(tail -n 120 test.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=FreeBSD ${{ matrix.release }} test log (last 120 lines)::$msg"
          rc=$(cat test.rc 2>/dev/null || echo missing)
          echo "test exit status: $rc"
          [ "$rc" = "0" ]
