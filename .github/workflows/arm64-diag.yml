name: arm64 diagnosis

on:
  push:
    branches: [arm64-diag]

jobs:
  arm64:
    name: aarch64 ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [live]
    steps:
      - uses: actions/checkout@v4
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          VARIANT: ${{ matrix.variant }}
        with:
          release: "14.3"
          arch: aarch64
          sync: sshfs
          envs: VARIANT
          usesh: true
          prepare: |
            pkg install -y go
          run: |
            set +e
            cd "$GITHUB_WORKSPACE"
            : > hb.log; : > progress.log; : > steps.log
            # the heartbeat must not keep the ssh session open: its own stdio goes away
            ( while true; do
                { date -u +%T; sysctl -n vm.stats.vm.v_free_count kstat.zfs.misc.arcstats.size 2>&1 | tr '\n' ' '; echo; ps -axo pid,rss,etime,command | sort -k2 -n -r | head -n 3; } >> hb.log 2>&1
                sleep 15
              done ) </dev/null >/dev/null 2>&1 &
            kldload zfs 2>&1
            truncate -s 512m /tmp/zpool.img
            zpool create -f -m none testpool /tmp/zpool.img >> steps.log 2>&1
            sh internal/ci/fixtures.sh testpool >> steps.log 2>&1 || echo "FIXTURES FAILED" >> steps.log
            export ZFS_TEST_POOL=testpool
            echo "go test start $(date -u +%T)" >> steps.log
            # every line of the test output goes to the host as it is written: each append closes the file
            go test -p 1 -v -count=1 -timeout 25m ./... 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%T)" "$line" >> progress.log; done
            echo "go test done $(date -u +%T)" >> steps.log
            exit 0
      - name: Surface what the VM wrote
        if: always()
        run: |
          for f in steps.log progress.log hb.log; do
            [ -f "$f" ] || { echo "::error::$f is missing"; continue; }
            msg=$(tail -n 45 "$f" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=${{ matrix.variant }} $f::$msg"
          done
